name: Update Pace GTFS feed

on:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Install pace-gtfs-downloader
      run: cargo install --git https://github.com/ethanc8/pace-gtfs-downloader.git --locked

    - name: Update Pace GTFS feed URL in DMFR
      run: pace-gtfs-downloader update-dmfr feeds/pacebus.com.dmfr.json

    - name: Install transitland-lib
      run: scripts/install-transitland-lib.sh
    - name: Format in the opinionated DMFR format
      run: transitland dmfr format --save feeds/pacebus.com.dmfr.json

    # Deliberately scoped to just the Pace feed rather than running the
    # repo-wide scripts/validate-feeds.py: that script's `transitland sync`
    # step processes every feeds/*.dmfr.json file, so an unrelated feed
    # elsewhere in the repo being invalid would fail this job and block the
    # Pace update even though the Pace feed itself is fine.
    - name: Validate Pace feed
      run: |
        python3 - <<'PY'
        import json
        import sys

        path = "feeds/pacebus.com.dmfr.json"
        expected_schema = "https://dmfr.transit.land/json-schema/dmfr.schema-v0.6.0.json"

        with open(path) as f:
            data = json.load(f)

        if data.get("$schema") != expected_schema:
            print(f"ERROR: {path} has unexpected $schema: {data.get('$schema')!r}", file=sys.stderr)
            sys.exit(1)

        print(f"{path} is valid JSON with schema {expected_schema}")
        PY

    - name: Commit and push if changes exist
      run: |
        set -eu
        git config user.name "Automated Bot"
        git config user.email "info@interline.io"

        if [ -z "$(git status --porcelain -- feeds/pacebus.com.dmfr.json)" ]; then
          echo "Pace GTFS feed URL is already up to date."
          exit 0
        fi

        echo "Pace GTFS feed URL has changed."
        git add feeds/pacebus.com.dmfr.json
        git commit -m "Updated Pace GTFS feed URL from pacebus.com at $(date -u)"
        git push origin HEAD:main
